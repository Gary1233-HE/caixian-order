<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="採鮮叫貨">
<meta name="theme-color" content="#1F3148">
<title>採鮮叫貨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E6E9EE; --paper:#FFFFFF; --ink:#1F3148; --muted:#687384; --line:#D1D6DE;
  --ok:#2E7A4C; --okbg:#EAF5EE; --warn:#C23B2E; --warnbg:#FBE7E4; --low:#D5730A; --lowbg:#FDEBD3; --citrus:#F2C230;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--catbg,var(--bg));color:var(--ink);font-family:var(--sans);font-size:16px;overscroll-behavior:none;transition:background .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--citrus);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--muted);line-height:1.7}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 10px) 14px 10px}
.top-row{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;font-size:19px;white-space:nowrap}
.sup{flex:1;min-width:0;display:flex;justify-content:flex-start}
.sup select{max-width:100%;min-width:78px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px;color:#fff;font-weight:700;font-size:15px;appearance:auto}
.sup select option{color:#000}
.date-in{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 6px;color:#fff;font-family:var(--mono);font-size:13px;color-scheme:dark;width:118px}
.who{background:var(--citrus);color:var(--ink);font-weight:700;border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;flex:none;background:#8a93a0}
.sync.on{background:#5BD88A}.sync.local{background:var(--citrus)}
.inv-line{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px}
.inv-line .src{flex:1;min-width:0;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-line .src b{font-family:var(--mono)}
.inv-line .src .ok{color:#5BD88A;font-weight:700}.inv-line .src .old{color:#FFB65C;font-weight:700}
.inv-line .cnt{font-family:var(--mono);font-weight:700;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sent-flag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.sent-flag.s{background:#5BD88A;color:var(--ink)}.sent-flag.m{background:#FFB65C;color:var(--ink)}

/* tabs */
.tabs{position:sticky;top:var(--tabs-top,96px);z-index:15;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--catbg,var(--bg));scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.08)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:10px;padding:7px 12px 6px;background:var(--ct);border:1px solid rgba(0,0,0,.08);text-align:left;position:relative;overflow:hidden}
.tab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.tab .t{font-weight:700;font-size:15px;display:block}
.tab .p{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tab .lw{color:var(--low);font-weight:700;margin-left:4px;font-family:var(--sans)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on .p{color:rgba(255,255,255,.7)}.tab.on .lw{color:#FFB65C}

/* list */
main{padding:6px 12px calc(84px + var(--safe-b))}
.cat-h{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
.cat-h h2{margin:0;font-size:20px;font-weight:900}
.cat-h .sw{width:12px;height:12px;border-radius:3px;background:var(--cc)}
.cat-h .act{margin-left:auto;font-size:13px;padding:6px 10px;border:1px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;font-weight:700}
.cat-h .act.sg{background:var(--low);color:#fff;border-color:var(--low)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:9px 12px;margin-bottom:6px;text-align:left;min-height:62px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}
.row .nm b small{font-size:12px;font-weight:500;color:var(--muted)}
.row .stk{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .stk .lo{color:var(--low);font-weight:700}.row .stk .z{color:var(--warn);font-weight:700}
.row .val{font-family:var(--mono);font-weight:700;font-size:22px;text-align:right;line-height:1.15;flex:none;max-width:52%;color:var(--ok)}
.row .val em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);margin:0 1px 0 5px}
.row .val em:first-child{margin-left:0}
.row .val.multi{font-size:17px}
.row .dash{color:#BFC5CC;font-size:22px}
.row .sug{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--low);border:1.5px dashed var(--low);border-radius:8px;padding:3px 7px;background:#fff;white-space:nowrap}
.row.set{background:#fff;border-color:rgba(0,0,0,.06);box-shadow:inset 5px 0 0 var(--ok)}
.row.need{background:#fff;box-shadow:inset 5px 0 0 var(--low)}
.bdg{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;line-height:17px;flex:none}
.bdg.lo{background:var(--low);color:#fff}.bdg.nl{background:var(--bg);color:var(--muted)}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bn button{flex:1;padding:10px 0 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bn button svg{width:22px;height:22px}
nav.bn button.on{color:var(--ink);font-weight:700}
nav.bn button.on svg{stroke:var(--low)}
nav.bn .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--low);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}

/* keypad */
.kp{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;height:100vh;height:100dvh;transform:translateY(100%);transition:transform .2s ease-out;visibility:hidden}
.kp.show{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.kp,.sheet,body{transition:none}}
.kp-top{background:var(--kt,var(--bg));padding:calc(var(--safe-t) + 8px) 12px 10px;display:flex;align-items:center;gap:8px}
.kp-top .bk{font-size:15px;font-weight:700;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);flex:none}
.kp-top .nm{flex:1;min-width:0}
.kp-top .nm b{display:block;font-size:26px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-top .nm span{font-size:13px;color:var(--muted)}
.kp-body{flex:1;display:flex;flex-direction:column;padding:10px 12px calc(10px + var(--safe-b));gap:8px;min-height:0;max-width:560px;width:100%;margin:0 auto}
.kp-info{display:grid;grid-template-columns:1.5fr 1fr;gap:6px}
.kp-info div{border-radius:12px;background:var(--bg);padding:7px 10px;min-width:0}
.kp-info small{display:block;font-size:12px;color:var(--muted)}
.kp-info .stk b{display:block;font-size:15px;line-height:1.35}
.kp-info .stk b .lo{color:var(--low)}.kp-info .stk b .z{color:var(--warn)}
.kp-info .pv b{font-size:15px;line-height:1.35;display:block}
.kp-opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 12px;margin:0 -12px}
.kp-opts::-webkit-scrollbar{display:none}
.kp-opts button{flex:none;min-width:64px;border:2px solid var(--line);border-radius:12px;padding:7px 14px;font-size:22px;font-weight:900;background:var(--paper);line-height:1.1}
.kp-opts button b{font-family:var(--mono);font-size:18px;margin-left:6px;color:var(--ok)}
.kp-opts button.has{border-color:var(--ok);background:var(--okbg)}
.kp-opts button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.kp-opts button.on b{color:#7EE3A5}
.kp-disp{display:flex;justify-content:flex-end;gap:10px;background:var(--bg);border-radius:14px;padding:6px 18px;min-height:74px;align-items:center}
.kp-disp .o{font-size:22px;font-weight:900;color:var(--muted);margin-right:auto}
.kp-disp .n{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1}
.kp-disp .n.ph{color:#B5BCC6}
.kp-disp .u{font-size:30px;font-weight:900}
.kp-msg{min-height:22px;font-size:14px;font-weight:700;text-align:center;border-radius:10px;padding:3px 8px}
.kp-msg.lo{color:var(--low);background:var(--lowbg)}.kp-msg.ok{color:var(--ok)}.kp-msg.nl{color:var(--muted)}
.kp-quick{display:grid;grid-template-columns:1.6fr .8fr 1fr;gap:6px}
.kp-quick button{border:1px solid var(--line);border-radius:10px;padding:10px 2px;font-size:14px;font-weight:700;background:var(--paper)}
.kp-quick .sg{color:#fff;background:var(--low);border-color:var(--low)}
.kp-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;min-height:190px}
.kp-grid button{background:var(--bg);border-radius:14px;font-family:var(--mono);font-size:30px;font-weight:700}
.kp-grid button:active,.kp-quick button:active{filter:brightness(.92)}
.kp-grid .fn{font-family:var(--sans);font-size:22px}
.kp-nav{display:grid;grid-template-columns:1fr 2.2fr;gap:6px}
.kp-nav button{border-radius:14px;padding:16px 0;font-weight:900;font-size:18px}
.kp-nav .pv{background:var(--bg)}
.kp-nav .go{background:var(--ink);color:#fff}

/* sheets & panels */
.scrim{position:fixed;inset:0;background:rgba(20,26,36,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease-out;max-width:560px;margin:0 auto;max-height:88vh;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head div{flex:1}.sh-head b{font-size:21px;font-weight:900;display:block}.sh-head span{font-size:13px;color:var(--muted)}
.sh-x{font-size:26px;line-height:1;padding:2px 8px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pick button{border:2px solid var(--line);border-radius:14px;padding:18px 0;font-size:21px;font-weight:900;background:var(--paper)}
.pick button.on{border-color:var(--ink);background:var(--citrus)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.panel h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.panel h3 .c{font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:6px;padding:1px 7px}
.panel h3 .c.o{background:var(--lowbg);color:var(--low)}
.panel h3 .r{margin-left:auto}
.panel.alert{border:2px solid var(--low);background:#FFFAF3}
.panel.fin{border:2px solid var(--ok);background:#F2FAF4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:14px;background:var(--paper)}
.chip.o{background:var(--lowbg);border-color:#F2C58E;color:var(--low);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--paper);width:100%}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok);font-size:17px;padding:14px}
.btn.sg{background:var(--low);color:#fff;border-color:var(--low)}
.btn.warn{color:var(--warn);border-color:#EDC0BA}
.btn.sm{width:auto;padding:6px 10px;font-size:13px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t .r{text-align:right;font-family:var(--mono);font-weight:700}
table.t tr[data-go]{cursor:pointer}
table.t .ch td{background:var(--ct);font-weight:900;font-size:13px;border-left:4px solid var(--cc)}
.lt{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--bg);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0 0 10px}
.hist{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist .d{font-family:var(--mono);font-weight:700;font-size:15px;width:100px;flex:none}
.hist .s{font-weight:700;width:56px;flex:none}
.hist .w{flex:1;font-size:13px;color:var(--muted)}
.hist .n{font-family:var(--mono);font-size:13px}
.hist .ck{color:var(--ok);font-weight:900}

/* settings */
.in{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%}
select.in{appearance:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;background:var(--paper)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ed-cat{margin:16px 0 6px;display:flex;align-items:center;gap:8px;font-weight:900}
.ed-cat .sw{width:12px;height:12px;border-radius:3px;background:var(--cc)}
.ed-cat button{margin-left:auto}
.ed-row{display:grid;grid-template-columns:1fr 92px 56px;gap:4px;align-items:center;margin-bottom:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ed-row .ac{grid-column:1/-1;display:flex;gap:4px}
.ed-row .ac .lk{flex:1;min-width:0}
.ed-row .ac button:not(.lk){width:40px;flex:none}
.ed-row input{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);min-width:0;width:100%}
.ed-row .u{text-align:center}
.ed-row button{height:36px;border-radius:8px;background:var(--bg);font-size:14px}
.ed-row .lk{font-size:13px;text-align:left;padding:0 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.ed-row .lk.no{color:var(--muted)}
.ed-row .del{color:var(--warn)}
.ed-head{display:grid;grid-template-columns:1fr 92px 56px;padding:0 7px;gap:4px;font-size:12px;color:var(--muted);margin:10px 0 4px}
.lkl{flex:1;overflow:auto;margin-top:10px;min-height:120px}
.lkl .gh{font-size:13px;font-weight:900;padding:8px 4px 4px;position:sticky;top:0;background:var(--paper)}
.lkl label{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.lkl label input{width:20px;height:20px}
.lkl label span{flex:1}
.lkl label small{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.sbar{display:flex;gap:8px;margin-top:10px}
.sbar input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:17px;background:#fff}
@media (min-width:700px){main,.tabs{max-width:760px;margin:0 auto}.rows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}}

/* print sheet */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-family:var(--sans)}
  .pf-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3mm}
  .pf-h b{font-size:18pt;font-weight:900}
  .pf-h span{font-size:12pt}
  .pf{width:100%;border-collapse:collapse;table-layout:fixed}
  .pf td{border:1px solid #000;height:6.2mm;padding:0 1.2mm;font-size:10.5pt;overflow:hidden;white-space:nowrap}
  .pf td.n{font-weight:700}
  .pf td.q{text-align:center;font-size:10pt}
  .pf td.q b{font-size:12.5pt;font-family:var(--mono)}
  .pf td.q i{font-style:normal;color:#555;font-size:9pt;margin-right:1mm}
  .pf td.h{font-weight:900;text-align:center;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pf td.gap{border:0}
  .pf-note{margin-top:3mm;border:1px solid #000;min-height:18mm;padding:2mm;font-size:11pt;white-space:pre-wrap}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <span class="sync" id="sync"></span>
    <div class="brand">採鮮叫貨</div>
    <div class="sup"><select id="supSel" aria-label="廠商"></select></div>
    <input type="date" class="date-in" id="date" aria-label="叫貨日期">
    <button class="who" id="who">選人員</button>
  </div>
  <div class="inv-line"><span class="src" id="invSrc">讀取點貨資料…</span><span id="sentFlag"></span><span class="cnt" id="ordCnt">0 項</span></div>
</header>

<div id="vOrd"><div class="tabs" id="tabs"></div><main id="list"></main></div>
<main id="vSum" class="hide"></main>
<main id="vHist" class="hide"></main>
<main id="vSet" class="hide"></main>

<nav class="bn" id="nav">
  <button data-v="Ord" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.2 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>叫貨</button>
  <button data-v="Sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>送出<span class="dot hide" id="navDot"></span></button>
  <button data-v="Hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>紀錄</button>
  <button data-v="Set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</nav>

<section class="kp" id="kp" aria-label="輸入叫貨數量">
  <div class="kp-top">
    <button class="bk" id="kpClose">← 清單</button>

const iVal = (i, e, u) => { if (!e) return null; if (e.vs) return e.vs[u] ?? null; return u === iUnits(i)[0] ? (e.v ?? null) : null };
const iZero = e => !!e && (e.vs ? Object.values(e.vs).length > 0 && Object.values(e.vs).every(x => x === 0) : e.v === 0);
const iFirst = (i, e) => iVal(i, e, iUnits(i)[0]);
const iNeed = (i, e) => { if (!e || !iMin(i)) return 0; if (iZero(e)) return iMin(i); const v = iFirst(i, e); return v != null && v < iMin(i) ? +(iMin(i) - v).toFixed(2) : 0 };
function iQty(i, e) {
  if (!e) return null;
  if (iZero(e)) return "缺貨";
  const us = iUnits(i), keys = e.vs ? [...us, ...Object.keys(e.vs).filter(u => !us.includes(u))] : us;
  return keys.map(u => { const v = iVal(i, e, u); return v == null ? null : fmt(v) + u }).filter(Boolean).join(" ") || null;
}

/* ---- 叫貨品項 ---- */
const isUnitOpt = o => UNIT_WORDS.has(o);
const optKeys = it => (it.o && it.o.length ? it.o : [""]);
function partText(it, o, q) {
  if (!o) return `${fmt(q)}${it.u || ""}`;
  if (isUnitOpt(o)) return `${fmt(q)}${o}`;
  return `${o}${fmt(q)}${it.u || ""}`;
}
function lineText(it, e) { if (!e || !e.vs) return ""; return optKeys(it).concat(Object.keys(e.vs).filter(k => !optKeys(it).includes(k))).filter(k => e.vs[k] != null && e.vs[k] > 0).map(k => partText(it, k, e.vs[k])).join(" ") }
function lineHtml(it, e) {
  const ks = optKeys(it).filter(k => e.vs[k] > 0);
  return ks.map(k => !k ? `${fmt(e.vs[k])}${it.u ? `<em>${esc(it.u)}</em>` : ""}` : isUnitOpt(k) ? `${fmt(e.vs[k])}<em>${esc(k)}</em>` : `<em>${esc(k)}</em>${fmt(e.vs[k])}${it.u ? `<em>${esc(it.u)}</em>` : ""}`).join(" ");
}
const hasQty = e => !!e && !!e.vs && Object.values(e.vs).some(v => v > 0);

/* ================= state ================= */
const S = {
  inv: null, ocfg: null, sup: null, date: today(), ord: null, invDay: null, prev: null,
  cat: null, view: "Ord", kp: null, draft: null, lkItem: null, unsub: [],
  me: (() => { try { return localStorage.getItem("caixian-order-me") || "" } catch { return "" } })()
};
const invItems = () => (S.inv && S.inv.items) || [];
const invById = id => invItems().find(i => i.id === id);
const invCounts = () => (S.invDay && S.invDay.counts) || {};
const sups = () => (S.ocfg && S.ocfg.sups) || [];
const people = () => (S.ocfg && S.ocfg.people && S.ocfg.people.length) ? S.ocfg.people : DEFAULT_PEOPLE;
const sup = () => sups().find(s => s.id === S.sup) || sups()[0];
const oItems = () => (sup() ? sup().items : []);

const lines = () => (S.ord && S.ord.lines) || {};
const catsOf = () => { const base = (S.inv && S.inv.cats) || DEF_CATS; const used = [...new Set(oItems().map(i => i.c))]; return [...base.filter(c => used.includes(c)), ...used.filter(c => !base.includes(c))] };
const itemsOf = c => oItems().filter(i => i.c === c);

/* 連動分析：每個叫貨品項 → 各個連動點貨品項的庫存、建議 */
function optFor(it, inv) {
  const ks = optKeys(it); if (ks.length === 1) return ks[0];
  const rest = inv.n.replace(it.n, "");
  const hit = ks.find(k => k && rest.includes(k)); if (hit) return hit;
  const u = iUnits(inv)[0]; if (ks.includes(u)) return u;
  return ks[0];
}
/* 叫貨日當天沒有點貨：庫存只當參考，不給建議、不提醒 */
const invStale = () => !S.invDay || S.invDay.date !== S.date;
function analyze(it) {
  const c = invCounts(), rows = [], sug = {}, stale = invStale();
  (it.inv || []).forEach(id => {
    const inv = invById(id); if (!inv) return;
    const e = c[id], need = stale ? 0 : iNeed(inv, e), o = optFor(it, inv);
    rows.push({ inv, e, need, o, qty: iQty(inv, e), min: iMin(inv), zero: iZero(e) });
    if (need > 0) sug[o] = +((sug[o] || 0) + need).toFixed(2);
  });
  return { rows, sug, stale, linked: rows.length > 0, needAny: Object.keys(sug).length > 0 };
}
function stockHtml(a) {
  if (!a.linked) return `<span>沒有連動點貨</span>`;
  if (!S.invDay) return `<span>還沒有點貨紀錄</span>`;
  const pre = a.stale ? `${dateLabel(S.invDay.date).replace(/（.）/, "")} ` : "";
  return pre + a.rows.map(r => {
    const nm = a.rows.length > 1 ? esc(r.inv.n) + " " : "庫存 ";
    if (r.e == null) return `${nm}未點`;
    const cls = r.zero ? "z" : r.need > 0 ? "lo" : "";
    return `${nm}<span class="${cls}">${esc(r.qty)}</span>${r.min ? `/安${fmt(r.min)}` : ""}`;
  }).join("　");
}
function sugText(it, sug) { return Object.entries(sug).map(([o, q]) => partText(it, o, q)).join(" ") }

/* ================= boot ================= */
$("#sync").className = "sync " + (store.mode === "fb" ? "on" : "local");
$("#sync").title = store.mode === "fb" ? "叫貨資料即時同步" : "本機模式：叫貨資料只存在這支手機";
$("#date").value = S.date;

let seeded = false, askedMe = false;
inv.watchCfg(c => { S.inv = c || { cats: DEF_CATS, items: [] }; ensureSeed(); render() });
store.watchOrdCfg(c => {
  S.ocfg = c; S.ocfgLoaded = true; ensureSeed();
  if (S.ocfg && !askedMe) { askedMe = true; if (!S.me || !people().includes(S.me)) { S.me = ""; openPeople() } }
  if (S.ocfg && S.ocfg.sups && S.ocfg.sups.length && !(S.ocfg.ver >= 3)) { migrate(); return }
  if (S.ocfg && S.ocfg.sups && S.ocfg.sups.length) {
    if (!S.sup || !sups().some(s => s.id === S.sup)) { let last = ""; try { last = localStorage.getItem("cxo-sup") || "" } catch {} S.sup = sups().some(s => s.id === last) ? last : sups()[0].id; openOrder() }
    renderSupSel();
  }
  render();
});
/* 舊設定自動修正：台青＝台灣蘆筍，不是青江菜 */
function migrate() {
  const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.ver = 3;
  if (!cfg.people || !cfg.people.length) cfg.people = DEFAULT_PEOPLE.slice();
  const x = cfg.sups.find(s => s.id === "xiluo");
  const it = x && x.items.find(i => i.n === "台青");
  if (it) { const qj = invItems().filter(i => i.n === "青江菜").map(i => i.id); it.inv = (it.inv || []).filter(id => !qj.includes(id)); if (it.u === "捆") it.u = "" }
  store.saveOrdCfg(cfg).catch(err);
}
function ensureSeed() {
  if (seeded || !S.inv || !S.ocfgLoaded) return;
  if (S.ocfg && S.ocfg.sups && S.ocfg.sups.length) return;
  seeded = true;
  const byName = {}; invItems().forEach(i => (byName[i.n] ||= []).push(i));
  const resolve = key => { const [n, c] = key.split("@"); const l = byName[n] || []; return (c ? l.find(i => i.c === c) : null) || (c ? null : l[0]) };
  const items = SEED_XILUO.map((r, k) => ({ id: "o" + String(k + 1).padStart(3, "0"), c: r[0], n: r[1], o: r[2], u: r[3], inv: r[4].map(resolve).filter(Boolean).map(i => i.id) }));
  const cfg = { ver: 3, people: DEFAULT_PEOPLE.slice(), sups: [{ id: "xiluo", name: "西螺", cols: XILUO_COLS, items }] };
  store.saveOrdCfg(cfg).catch(err);
}
function openOrder() {
  S.unsub.forEach(f => typeof f === "function" && f()); S.unsub = [];
  S.ord = null; S.invDay = null; S.prev = null;
  const d = S.date, s = S.sup;
  S.unsub.push(store.watchOrder(d, s, x => { if (S.date === d && S.sup === s) { S.ord = x; render() } }));
  S.unsub.push(inv.watchDay(d, x => { if (S.date === d) { S.invDay = x; render() } }));
  store.prevOrder(d, s).then(p => { if (S.date === d && S.sup === s) { S.prev = p; render() } }).catch(err);
  if (!S.cat || !catsOf().includes(S.cat)) S.cat = catsOf()[0];
}
$("#date").addEventListener("change", e => { if (e.target.value) { S.date = e.target.value; openOrder(); render() } });
let lastToday = today();
setInterval(() => { const t = today(); if (t !== lastToday) { if (S.date === lastToday) { S.date = t; $("#date").value = t; openOrder() } lastToday = t } }, 60000);
function renderSupSel() {
  $("#supSel").innerHTML = sups().map(s => `<option value="${esc(s.id)}"${s.id === S.sup ? " selected" : ""}>${esc(s.name)}</option>`).join("");
}
$("#supSel").onchange = e => { S.sup = e.target.value; try { localStorage.setItem("cxo-sup", S.sup) } catch {} S.cat = null; openOrder(); render() };

/* ================= render ================= */
function render() {
  if (!S.inv || !S.ocfg || !sup()) return;
  if (!S.cat || !catsOf().includes(S.cat)) S.cat = catsOf()[0];
  renderTop();
  if (S.view === "Ord") renderOrd();
  if (S.view === "Sum") renderSum();
  if (S.view === "Hist") renderHist();
  if (S.view === "Set" && !S.draft) renderSet();
  if (S.kp) renderKp();
  renderWho();
}
function ordStats() {
  const L = lines(), its = oItems();
  const ordered = its.filter(i => hasQty(L[i.id]));
  const miss = its.filter(i => !hasQty(L[i.id]) && analyze(i).needAny);
  return { ordered, miss };
}
function renderTop() {
  const d = S.invDay, st = ordStats();
  let src;
  if (!d) src = `還沒有點貨紀錄，直接輸入數量叫貨`;
  else {
    const n = Object.keys(d.counts || {}).length, tot = invItems().length;
    const old = d.date !== S.date;
    src = old
      ? `${S.date === today() ? "今天" : "這天"}沒點貨，庫存看 <b>${dateLabel(d.date)}</b> 僅供參考`
      : `點貨 <b>${dateLabel(d.date)}</b>　${d.done ? `<span class="ok">✓ ${esc(d.done.by)} 完成</span>` : `點了 ${n}/${tot}`}`;
  }
  $("#invSrc").innerHTML = src;
  $("#ordCnt").textContent = `叫 ${st.ordered.length} 項`;
  const sent = S.ord && S.ord.sent;
  const mod = sent && sent.edited && sent.edited > sent.t;
  $("#sentFlag").innerHTML = sent ? `<span class="sent-flag ${mod ? "m" : "s"}">${mod ? "傳送後有改" : "已傳送 " + hm(sent.t)}</span>` : "";
  const dot = $("#navDot"); dot.classList.toggle("hide", !st.miss.length); dot.textContent = st.miss.length;
  document.documentElement.style.setProperty("--tabs-top", $("#top").offsetHeight + "px");
}

function renderOrd() {
  const L = lines();
  document.documentElement.style.setProperty("--catbg", catTint(S.cat));
  $("#tabs").innerHTML = catsOf().map(cat => {
    const its = itemsOf(cat), d = its.filter(i => hasQty(L[i.id])).length;
    const lw = its.filter(i => !hasQty(L[i.id]) && analyze(i).needAny).length;
    return `<button class="tab${cat === S.cat ? " on" : ""}" style="--cc:${catColor(cat)};--ct:${catTint(cat)}" data-cat="${esc(cat)}"><span class="t">${esc(cat)}</span><span class="p">叫${d}/${its.length}${lw ? `<span class="lw">補${lw}</span>` : ""}</span></button>`;
  }).join("");
  const on = $("#tabs .tab.on"); if (on) { const t = $("#tabs"); t.scrollTo({ left: Math.max(0, on.offsetLeft - (t.clientWidth - on.offsetWidth) / 2) }) }
  const its = itemsOf(S.cat);
  const sugN = its.filter(i => !hasQty(L[i.id]) && analyze(i).needAny).length;
  $("#list").innerHTML = `<div class="cat-h" style="--cc:${catColor(S.cat)}"><span class="sw"></span><h2>${esc(S.cat)}</h2>
    ${sugN ? `<button class="act sg" data-fillcat="1">帶入建議 ${sugN} 項</button>` : `<span class="muted" style="margin-left:auto">${its.filter(i => hasQty(L[i.id])).length} 項已叫</span>`}</div>
    <div class="rows">${its.map(i => rowHtml(i, L[i.id])).join("")}</div>`;
}
function rowHtml(it, e) {
  const a = analyze(it), ordered = hasQty(e);
  let cls = "row", val = `<span class="dash">—</span>`;
  if (ordered) { cls += " set"; val = lineHtml(it, e) }
  else if (a.needAny) { cls += " need"; val = `<span class="sug">建議 ${esc(sugText(it, a.sug))}</span>` }
  const multi = ordered && Object.values(e.vs).filter(v => v > 0).length > 1;
  const spec = it.o && it.o.length ? `<small>${esc(it.o.join("/"))}</small>` : it.u ? `<small>${esc(it.u)}</small>` : "";
  return `<button class="${cls}" data-id="${it.id}"><span class="nm"><b>${esc(it.n)}${spec}</b><span class="stk">${stockHtml(a)}</span></span><span class="val${multi ? " multi" : ""}">${val}</span></button>`;
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; S.cat = b.dataset.cat; renderOrd(); window.scrollTo(0, 0) });
$("#list").addEventListener("click", e => {
  if (e.target.closest("[data-fillcat]")) { fillSuggest(itemsOf(S.cat)); return }
  const r = e.target.closest("[data-id]"); if (r) openKp(r.dataset.id);
});
function fillSuggest(its) {
  if (needMe()) return;
  const L = lines(), obj = {}; let n = 0;
  its.forEach(it => { if (hasQty(L[it.id])) return; const a = analyze(it); if (!a.needAny) return; obj[it.id] = mkEntry(it, a.sug, true); n++ });
  if (!n) return toast("沒有需要帶入的建議");
  store.setLines(S.date, S.sup, obj); stampEdit();
  toast(`已帶入 ${n} 項建議，數量可以再點進去改`);
}
function mkEntry(it, vs, sug) { return { vs, by: S.me, t: Date.now(), n: it.n, c: it.c, ...(sug ? { sug: true } : {}) } }
/* ================= keypad ================= */
function needMe() { if (!S.me) { openPeople(); return true } return false }
function openKp(id) {
  if (needMe()) return;
  const it = oById(id); if (!it) return;
  const e = lines()[id], ks = optKeys(it), a = analyze(it);
  const bufs = {}, fresh = {};
  ks.forEach(k => { const v = e && e.vs ? e.vs[k] : null; bufs[k] = v != null && v > 0 ? fmt(v) : ""; fresh[k] = true });
  const first = ks.find(k => bufs[k] !== "") ?? ks.find(k => a.sug[k]) ?? ks[0];
  S.kp = { id, ks, bufs, fresh, touched: {}, o: first };
  S.cat = it.c;
  const kp = $("#kp"); kp.style.setProperty("--kt", catTint(it.c)); kp.classList.add("show");
  renderKp();
}
function closeKp() { $("#kp").classList.remove("show"); S.kp = null; render() }
function kpNum(k) { const b = S.kp.bufs[k]; if (b === "" || b === ".") return null; const v = parseFloat(b); return isNaN(v) ? null : v }
function renderKp() {
  const k = S.kp, it = oById(k.id); if (!it) return closeKp();
  const a = analyze(it), e = lines()[k.id];
  $("#kpName").textContent = it.n;
  $("#kpSub").textContent = [it.c, sup().name, it.o && it.o.length ? it.o.join("/") : it.u].filter(Boolean).join("　");
  $("#kpStkL").textContent = S.invDay ? `庫存（${dateLabel(S.invDay.date)} 點貨）` : "庫存";
  $("#kpStk").innerHTML = a.linked ? a.rows.map(r => {
    const nm = a.rows.length > 1 ? esc(r.inv.n) + " " : "";
    if (r.e == null) return `<div>${nm}未點${r.min ? `　安全 ${fmt(r.min)}` : ""}</div>`;
    return `<div>${nm}<span class="${r.zero ? "z" : r.need > 0 ? "lo" : ""}">${esc(r.qty)}</span>${r.min ? `　安全 ${fmt(r.min)}` : ""}</div>`;
  }).join("") : `<span style="color:var(--muted)">沒有連動點貨</span>`;
  const pe = S.prev && S.prev.lines && S.prev.lines[k.id];
  $("#kpPrev").innerHTML = pe && hasQty(pe) ? `${esc(lineText(it, pe))}<br><span style="font-size:12px;color:var(--muted)">${dateLabel(S.prev.date)}</span>` : "—";
  const showOpts = k.ks.length > 1 || (k.ks[0] && k.ks[0] !== "");
  $("#kpOpts").classList.toggle("hide", !showOpts);
  $("#kpOpts").innerHTML = k.ks.map(o => `<button class="${o === k.o ? "on" : ""}${k.bufs[o] !== "" ? " has" : ""}" data-o="${esc(o)}">${esc(o || "數量")}${k.bufs[o] !== "" ? `<b>${esc(k.bufs[o])}</b>` : ""}</button>`).join("");
  const b = k.bufs[k.o], n = $("#kpNum");
  n.textContent = b === "" ? "0" : b; n.classList.toggle("ph", b === "");
  $("#kpOpt").textContent = k.o && !isUnitOpt(k.o) ? k.o : "";
  $("#kpUnit").textContent = isUnitOpt(k.o) ? k.o : it.u || "";
  const m = $("#kpMsg");
  if (!a.linked) { m.className = "kp-msg nl"; m.textContent = "這項沒有連動點貨，到「設定」可以連動" }
  else if (!S.invDay) { m.className = "kp-msg nl"; m.textContent = "還沒有點貨紀錄，直接輸入數量" }
  else if (a.stale) { m.className = "kp-msg nl"; m.textContent = `沒有當天點貨，庫存是 ${dateLabel(S.invDay.date)} 的，只供參考` }
  else if (a.needAny) { m.className = "kp-msg lo"; m.textContent = `低於安全量，建議叫 ${sugText(it, a.sug)}（以點貨單位計）` }
  else if (a.rows.every(r => r.e == null)) { m.className = "kp-msg nl"; m.textContent = "今天還沒點到這項" }
  else { m.className = "kp-msg ok"; m.textContent = "庫存在安全量以上" }
  const sg = $("#kpSug"); sg.disabled = !a.needAny; sg.textContent = a.needAny ? `帶入建議 ${sugText(it, a.sug)}` : "沒有建議量";

function commitKp() {
  const k = S.kp, it = oById(k.id), e = lines()[k.id];
  if (!Object.keys(k.touched).length) return;
  const vs = {};
  k.ks.forEach(o => { const v = k.touched[o] ? kpNum(o) : (e && e.vs ? e.vs[o] : null); if (v != null && v > 0) vs[o] = v });
  store.setLine(S.date, S.sup, it.id, Object.keys(vs).length ? mkEntry(it, vs) : null);
  stampEdit();
}
function step(dir) {
  const all = catsOf().flatMap(c => itemsOf(c)), idx = all.findIndex(i => i.id === S.kp.id), nx = all[idx + dir];
  if (!nx) { closeKp(); if (dir > 0) { toast("最後一項了，到「送出」確認後傳給廠商"); setView("Sum") } return }
  if (nx.c !== oById(S.kp.id).c) toast("換到 " + nx.c, 1200);
  openKp(nx.id);
}
$("#kp").addEventListener("click", ev => {
  const ob = ev.target.closest("[data-o]"); if (ob) { S.kp.o = ob.dataset.o; renderKp(); return }
  const kb = ev.target.closest("[data-k]"); if (!kb) return;
  const k = S.kp, o = k.o, key = kb.dataset.k;
  let b = k.fresh[o] ? "" : k.bufs[o]; k.fresh[o] = false; k.touched[o] = true;
  if (key === "bk") b = b.slice(0, -1);
  else if (key === "half") { const base = parseFloat(b || "0"); b = fmt(Math.floor(base) + .5) }
  else if (key === ".") { if (!b.includes(".")) b = (b || "0") + "." }
  else { if (b === "0") b = ""; if (b.replace(".", "").length < 6) b += key }
  k.bufs[o] = b; renderKp();
});
$("#kpGo").onclick = () => { commitKp(); step(1) };
$("#kpPrevBtn").onclick = () => { commitKp(); step(-1) };
$("#kpSug").onclick = () => {
  const k = S.kp, it = oById(k.id), a = analyze(it); if (!a.needAny) return;
  Object.entries(a.sug).forEach(([o, q]) => { if (k.ks.includes(o)) { k.bufs[o] = fmt(q); k.fresh[o] = true; k.touched[o] = true } });
  renderKp();
};
$("#kpClear").onclick = () => { const k = S.kp; store.setLine(S.date, S.sup, k.id, null); stampEdit(); k.ks.forEach(o => { k.bufs[o] = ""; k.fresh[o] = true }); k.touched = {}; renderKp() };
$("#kpClose").onclick = () => { commitKp(); closeKp() };
document.addEventListener("keydown", e => {
  if (!S.kp) return;
  if (/^[0-9.]$/.test(e.key)) document.querySelector(`#kp [data-k="${e.key}"]`)?.click();
  else if (e.key === "Backspace") document.querySelector(`#kp [data-k="bk"]`).click();
  else if (e.key === "Enter") $("#kpGo").click();
  else if (e.key === "Escape") $("#kpClose").click();
});

/* ---------- 紙本採購單（仿西螺採購單版面） ---------- */
function sheetCols() {
  const s = sup(), cats = catsOf();
  if (s.cols && s.cols.length) {
    const cols = s.cols.map(c => c.filter(x => cats.includes(x)));
    const rest = cats.filter(c => !cols.flat().includes(c));
    rest.forEach(c => { const m = cols.reduce((a, b, i) => cols[i].reduce((n, x) => n + itemsOf(x).length + 1, 0) < cols[a].reduce((n, x) => n + itemsOf(x).length + 1, 0) ? i : a, 0); cols[m].push(c) });
    return cols;
  }
  const cols = [[], [], []], len = [0, 0, 0];
  cats.forEach(c => { const i = len.indexOf(Math.min(...len)); cols[i].push(c); len[i] += itemsOf(c).length + 1 });
  return cols;
}
function sheetGrid() {
  const L = lines();
  return sheetCols().map(col => col.flatMap(cat => [
    { h: cat },
    ...itemsOf(cat).map(it => {
      const e = L[it.id], ks = optKeys(it);
      const cells = ks.length === 1 ? [[ks[0] || it.u || "", e && e.vs ? e.vs[ks[0]] : null], ["", null]] : ks.slice(0, 2).map(k => [k, e && e.vs ? e.vs[k] : null]);
      const extra = ks.slice(2).filter(k => e && e.vs && e.vs[k] > 0).map(k => partText(it, k, e.vs[k])).join(" ");
      return { n: it.n + (extra ? " " + extra : ""), cells };
    })
  ]));
}
function printSheet() {
  const g = sheetGrid(), rows = Math.max(...g.map(c => c.length));
  let h = `<div class="pf-h"><b>採鮮農產行　${esc(sup().name)}採購單</b><span>${S.date.replace(/-/g, " / ")}　${dateLabel(S.date).slice(-3)}</span></div><table class="pf"><colgroup>${g.map((_, i) => `<col style="width:15%"><col style="width:9%"><col style="width:9%">${i < g.length - 1 ? `<col style="width:1%">` : ""}`).join("")}</colgroup>`;
  for (let r = 0; r < rows; r++) {
    h += "<tr>" + g.map((col, i) => {
      const x = col[r], gap = i < g.length - 1 ? `<td class="gap"></td>` : "";
      if (!x) return `<td style="border:0"></td><td style="border:0"></td><td style="border:0"></td>${gap}`;
      if (x.h) return `<td class="h">${esc(x.h)}</td><td class="h">數量</td><td class="h">數量</td>${gap}`;
      return `<td class="n">${esc(x.n)}</td>${x.cells.map(([k, v]) => `<td class="q">${k ? `<i>${esc(k)}</i>` : ""}${v > 0 ? `<b>${fmt(v)}</b>` : ""}</td>`).join("")}${gap}`;
    }).join("") + "</tr>";
  }
  h += "</table>";
  const note = (S.ord && S.ord.note || "").trim();

}
function exportXlsx() {
  if (!window.XLSX) return toast("Excel 元件還沒載入，稍後再試");
  const g = sheetGrid(), rows = Math.max(...g.map(c => c.length));
  const aoa = [[`採鮮農產行 ${sup().name}採購單`, "", "", "", "", "", "", S.date], []];
