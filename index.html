<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="採鮮叫貨">
<meta name="theme-color" content="#1F3148">
<title>採鮮叫貨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E6E9EE; --paper:#FFFFFF; --ink:#1F3148; --muted:#687384; --line:#D1D6DE;
  --ok:#2E7A4C; --okbg:#EAF5EE; --warn:#C23B2E; --warnbg:#FBE7E4; --low:#D5730A; --lowbg:#FDEBD3; --citrus:#F2C230;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--catbg,var(--bg));color:var(--ink);font-family:var(--sans);font-size:16px;overscroll-behavior:none;transition:background .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--citrus);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--muted);line-height:1.7}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 10px) 14px 10px}
.top-row{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;font-size:19px;white-space:nowrap}
.sup{flex:1;min-width:0;display:flex;justify-content:flex-start}
.sup select{max-width:100%;min-width:78px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px;color:#fff;font-weight:700;font-size:15px;appearance:auto}
.sup select option{color:#000}
.date-in{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 6px;color:#fff;font-family:var(--mono);font-size:13px;color-scheme:dark;width:118px}
.who{background:var(--citrus);color:var(--ink);font-weight:700;border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;flex:none;background:#8a93a0}
.sync.on{background:#5BD88A}.sync.local{background:var(--citrus)}
.inv-line{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px}
.inv-line .src{flex:1;min-width:0;opacity:.9;line-height:1.45}
.inv-line .src b{font-family:var(--mono)}
.inv-line .src .ok{color:#5BD88A;font-weight:700}.inv-line .src .old{color:#FFB65C;font-weight:700}
.inv-line .cnt{font-family:var(--mono);font-weight:700;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sent-flag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.sent-flag.s{background:#5BD88A;color:var(--ink)}.sent-flag.m{background:#FFB65C;color:var(--ink)}

/* tabs */
.tabs{position:sticky;top:var(--tabs-top,96px);z-index:15;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--catbg,var(--bg));scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.08)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:10px;padding:7px 12px 6px;background:var(--ct);border:1px solid rgba(0,0,0,.08);text-align:left;position:relative;overflow:hidden}
.tab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.tab .t{font-weight:700;font-size:15px;display:block}
.tab .p{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tab .lw{color:var(--low);font-weight:700;margin-left:4px;font-family:var(--sans)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on .p{color:rgba(255,255,255,.7)}.tab.on .lw{color:#FFB65C}

/* list */
main{padding:6px 12px calc(84px + var(--safe-b))}
.cat-h{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
.cat-h h2{margin:0;font-size:20px;font-weight:900}
.cat-h .sw{width:12px;height:12px;border-radius:3px;background:var(--cc)}
.cat-h .act{margin-left:auto;font-size:13px;padding:6px 10px;border:1px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;font-weight:700}
.cat-h .act.sg{background:var(--low);color:#fff;border-color:var(--low)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:9px 12px;margin-bottom:6px;text-align:left;min-height:62px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}
.row .nm b small{font-size:12px;font-weight:500;color:var(--muted)}
.row .stk{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .stk .lo{color:var(--low);font-weight:700}.row .stk .z{color:var(--warn);font-weight:700}
.row .val{font-family:var(--mono);font-weight:700;font-size:22px;text-align:right;line-height:1.15;flex:none;max-width:52%;color:var(--ok)}
.row .val em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);margin:0 1px 0 5px}
.row .val em:first-child{margin-left:0}
.row .val.multi{font-size:17px}
.row .dash{color:#BFC5CC;font-size:22px}
.row .sug{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--low);border:1.5px dashed var(--low);border-radius:8px;padding:3px 7px;background:#fff;white-space:nowrap}
.row.set{background:#fff;border-color:rgba(0,0,0,.06);box-shadow:inset 5px 0 0 var(--ok)}
.row.need{background:#fff;box-shadow:inset 5px 0 0 var(--low)}
.bdg{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;line-height:17px;flex:none}
.bdg.lo{background:var(--low);color:#fff}.bdg.okd{background:var(--ok);color:#fff}.bdg.nl{background:var(--bg);color:var(--muted)}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bn button{flex:1;padding:10px 0 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bn button svg{width:22px;height:22px}
nav.bn button.on{color:var(--ink);font-weight:700}
nav.bn button.on svg{stroke:var(--low)}
nav.bn .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--low);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}

/* keypad */
.kp{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;height:100vh;height:100dvh;transform:translateY(100%);transition:transform .2s ease-out;visibility:hidden}
.kp.show{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.kp,.sheet,body{transition:none}}
.kp-top{background:var(--kt,var(--bg));padding:calc(var(--safe-t) + 8px) 12px 10px;display:flex;align-items:center;gap:8px}
.kp-top .bk{font-size:15px;font-weight:700;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);flex:none}
.kp-top .nm{flex:1;min-width:0}
.kp-top .nm b{display:block;font-size:26px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-top .nm span{font-size:13px;color:var(--muted)}
.kp-body{flex:1;display:flex;flex-direction:column;padding:10px 12px calc(10px + var(--safe-b));gap:8px;min-height:0;max-width:560px;width:100%;margin:0 auto;overflow:hidden}
.kp-body>*{flex:none}
.kp-body>.kp-grid{flex:1 1 auto}
.kp-info{display:grid;grid-template-columns:1.5fr 1fr;gap:6px}
.kp-info div{border-radius:12px;background:var(--bg);padding:7px 10px;min-width:0}
.kp-info small{display:block;font-size:12px;color:var(--muted)}
.kp-info .stk b{display:block;font-size:15px;line-height:1.35}
.kp-info .stk b .lo{color:var(--low)}.kp-info .stk b .z{color:var(--warn)}
.kp-info .pv b{font-size:15px;line-height:1.35;display:block}
.kp-opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 12px;margin:0 -12px}
.kp-opts::-webkit-scrollbar{display:none}
.kp-opts button{flex:none;min-width:64px;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:7px 14px;font-size:22px;font-weight:900;background:var(--paper);line-height:1.1}
.kp-opts button b{font-family:var(--mono);font-size:18px;margin-left:6px;color:var(--ok)}
.kp-opts button.has{border-color:var(--ok);background:var(--okbg)}
.kp-opts button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.kp-opts button.on b{color:#7EE3A5}
.kp-disp{display:flex;justify-content:flex-end;gap:10px;background:var(--bg);border-radius:14px;padding:6px 18px;min-height:74px;align-items:center}
.kp-disp .o{font-size:22px;font-weight:900;color:var(--muted);margin-right:auto}
.kp-disp .n{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1}
.kp-disp .n.ph{color:#B5BCC6}
.kp-disp .u{font-size:30px;font-weight:900}
.kp-msg{min-height:22px;font-size:13px;font-weight:700;text-align:center;border-radius:10px;padding:3px 8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kp-msg.lo{color:var(--low);background:var(--lowbg)}.kp-msg.ok{color:var(--ok)}.kp-msg.nl{color:var(--muted)}
.kp-quick{display:grid;grid-template-columns:1.6fr .8fr 1fr;gap:6px}
.kp-quick button{border:1px solid var(--line);border-radius:10px;padding:10px 2px;font-size:14px;font-weight:700;background:var(--paper)}
.kp-quick .sg{color:#fff;background:var(--low);border-color:var(--low)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;min-height:0}
/* 螢幕矮的時候自動縮小，不用捲動 */
@media (max-height:720px){
  .kp-top{padding-top:calc(var(--safe-t) + 4px);padding-bottom:6px}.kp-top .nm b{font-size:22px}
  .kp-body{gap:6px;padding-top:6px}
  .kp-info div{padding:5px 9px}.kp-info .stk b,.kp-info .pv b{font-size:14px}
  .kp-opts button{min-height:40px;padding:4px 12px;font-size:19px}
  .kp-disp{min-height:56px;padding:4px 16px}.kp-disp .n{font-size:40px}.kp-disp .u{font-size:24px}
  .kp-msg{min-height:18px;font-size:13px;padding:1px 8px}
  .kp-quick button{padding:7px 2px}
  .kp-grid button{font-size:26px}
  .kp-nav button{padding:12px 0}
}
@media (max-height:540px){
  .kp-info{display:none}
  .kp-disp{min-height:48px}.kp-disp .n{font-size:34px}
}
@media (min-height:760px) and (min-width:700px){.kp-grid{max-height:340px}}
.kp-grid button{background:var(--bg);border-radius:14px;font-family:var(--mono);font-size:30px;font-weight:700}
.kp-grid button:active,.kp-quick button:active{filter:brightness(.92)}
.kp-grid .fn{font-family:var(--sans);font-size:22px}
.kp-nav{display:grid;grid-template-columns:1fr 2.2fr;gap:6px}
.kp-nav button{border-radius:14px;padding:16px 0;font-weight:900;font-size:18px}
.kp-nav .pv{background:var(--bg)}
.kp-nav .go{background:var(--ink);color:#fff}

/* sheets & panels */
.scrim{position:fixed;inset:0;background:rgba(20,26,36,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease-out;max-width:560px;margin:0 auto;max-height:88vh;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head div{flex:1}.sh-head b{font-size:21px;font-weight:900;display:block}.sh-head span{font-size:13px;color:var(--muted)}
.sh-x{font-size:26px;line-height:1;padding:2px 8px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pick button{border:2px solid var(--line);border-radius:14px;padding:18px 0;font-size:21px;font-weight:900;background:var(--paper)}
.pick button.on{border-color:var(--ink);background:var(--citrus)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.panel h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.panel h3 .c{font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:6px;padding:1px 7px}
.panel h3 .c.o{background:var(--lowbg);color:var(--low)}
.panel h3 .r{margin-left:auto}
.panel.alert{border:2px solid var(--low);background:#FFFAF3}
.panel.fin{border:2px solid var(--ok);background:#F2FAF4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:14px;background:var(--paper)}
.chip.o{background:var(--lowbg);border-color:#F2C58E;color:var(--low);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--paper);width:100%}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok);font-size:17px;padding:14px}
.btn.sg{background:var(--low);color:#fff;border-color:var(--low)}
.btn.warn{color:var(--warn);border-color:#EDC0BA}
.btn.sm{width:auto;padding:6px 10px;font-size:13px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t .r{text-align:right;font-family:var(--mono);font-weight:700}
table.t tr[data-go]{cursor:pointer}
table.t .ch td{background:var(--ct);font-weight:900;font-size:13px;border-left:4px solid var(--cc)}
.amt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.amt div{margin-right:auto}.amt small{display:block;font-size:12px;color:var(--muted)}.amt b{font-family:var(--mono);font-size:26px}
.amt .c{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--paper)}
.amt .c.o{background:var(--lowbg);color:var(--low)}
.c.ok,.amt .c.ok{background:var(--okbg);color:var(--ok)}
table.pt td{vertical-align:middle;padding:5px 3px}
table.pt td small{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:500;margin-left:1px}
table.pt .spec{display:inline-block;font-size:12px;font-weight:700;background:var(--bg);border-radius:5px;padding:0 5px;margin-left:4px}
table.pt td[data-go]{cursor:pointer}
table.pt .pin{width:74px;border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:right;font-family:var(--mono);font-weight:700;font-size:15px;background:#fff}
table.pt .pin::placeholder{color:#B5BCC6;font-weight:400}
table.pt .wrow{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin-top:4px}
table.pt .win{width:52px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;text-align:right;font-family:var(--mono);font-size:13px;background:#fff}
table.pt .win.inh{color:#8A93A0;background:var(--bg)}
table.pt .win::placeholder{color:#C5CBD3}
table.pt .pkg{display:block;font-size:11px;color:var(--ink);margin-top:2px}
table.pt tr.np .pin{border-color:#F2C58E;background:#FFFAF3}
table.pt tr.tot td{font-weight:900;border-bottom:0;padding-top:10px}
table.pt tr.tot .r{font-size:18px}
table.rt td{vertical-align:middle;padding:5px 3px}
table.rt td small{font-size:11px;color:var(--muted);margin-left:1px}
table.rt .spec{display:inline-block;font-size:12px;font-weight:700;background:var(--bg);border-radius:5px;padding:0 5px;margin-left:4px}
table.rt .rin{width:64px;border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:right;font-family:var(--mono);font-weight:700;font-size:15px;background:#fff}
table.rt .rin::placeholder{color:#C5CBD3;font-weight:400}
.rv-btn{width:38px;height:34px;border-radius:8px;border:2px solid var(--ok);color:var(--ok);font-weight:900;background:#fff}
.rv-t{font-size:12px;font-weight:900;border-radius:6px;padding:5px 7px;white-space:nowrap;border:0}
.rv-t.ok{background:var(--okbg);color:var(--ok)}.rv-t.bad{background:var(--warnbg);color:var(--warn)}.rv-t.over{background:var(--lowbg);color:var(--low)}
tr.rv-short td,tr.rv-over td{background:#FFF6F4}
.c.bad{background:var(--warnbg);color:var(--warn)}
.pc-i{border-top:1px solid var(--line);padding:10px 0}.pc-i:first-of-type{border-top:0;padding-top:0}
.pc-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.pc-h b{font-size:16px}
table.pc-t td small{font-size:11px;color:var(--muted);margin-left:3px}
table.pc-t td b{font-family:var(--mono);font-size:17px}
.pc-ex{margin:6px 0 0;font-size:12px;color:var(--low);font-weight:700}
.pc-e{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
.pc-eh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.pc-eh b{font-size:16px;margin-right:auto}
.pc-eh input{width:70px;padding:6px;text-align:center}
.pc-row{display:grid;grid-template-columns:1.6fr .9fr .8fr .9fr .9fr 34px;gap:4px;margin-bottom:4px;align-items:center}
.pc-row input{padding:7px 4px;min-width:0;font-size:14px;text-align:center}.pc-row input[data-f="n"]{text-align:left}
.pc-row input:disabled{opacity:.4}
.pc-lab{font-size:11px;color:var(--muted)}
.ck-g{border-left:4px solid var(--cc);padding-left:8px;margin:10px 0 4px}
.ck-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;margin-bottom:4px}
.ck-h small{font-family:var(--mono);color:var(--muted);font-weight:700}
.ck-ga{margin-left:auto;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:#fff}
.ck-r{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);min-height:46px}
.ck-r .bx{width:26px;height:26px;border-radius:7px;border:2px solid #B9C0CA;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;background:#fff}
.ck-r .nm{flex:1;font-weight:700;min-width:0}
.ck-r .q{font-family:var(--mono);font-weight:700;white-space:nowrap}
.ck-r .w{font-size:11px;color:var(--muted);width:64px;text-align:right;flex:none}
.ck-r.ok .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ck-r.ok .nm,.ck-r.ok .q{color:var(--muted);text-decoration:line-through}
.ck-r.chg .bx{background:var(--low);border-color:var(--low);color:#fff}
.ck-r.chg .w{color:var(--low);font-weight:700}

.pay-d{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.pay-d .chip{font-size:12px;padding:3px 7px}
.pay-b{display:grid;grid-template-columns:2fr 1fr;gap:6px}.pay-b .btn:only-child{grid-column:1/-1}

.py-r .d{font-family:var(--mono);width:44px;flex:none}.py-r .m{font-weight:700;width:30px;flex:none}.py-r .w{flex:1;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .pf td.n.sm{font-size:calc(var(--fn) * .88);letter-spacing:-.03em}
  .pf td.tq.sm{font-size:calc(var(--fq) * .9);letter-spacing:-.03em}
  .pf td.tq.xs{font-size:calc(var(--fq) * .8);letter-spacing:-.04em}
  .pf td i{font-style:normal;color:#555;font-size:.68em;margin-right:.8mm;vertical-align:.08em}
  .pf td i.e{color:#aaa;font-size:.72em}
  .pv-page{page-break-before:always;break-before:page}
  .pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .pv{border:1.5px solid #000;padding:2.5mm;break-inside:avoid}
  .pv-t{font-size:16pt;font-weight:900;border-bottom:1.5px solid #000;padding-bottom:1.5mm;margin-bottom:1.5mm}
  .pv-t small{font-size:10pt;font-weight:500;margin-left:3mm}
  .pv table{width:100%;border-collapse:collapse}
  .pv td{border-bottom:1px solid #999;padding:1.2mm 1mm;font-size:12pt}
  .pv td.r{text-align:right;font-weight:700;font-family:var(--mono)}
}
</style>

/* Firestore 不接受空字串當欄位名稱：沒有規格的品項，數量存成 vs["_"]，讀回來再轉成 vs[""] */
const BL = "_";
const mapKeys = (o, f) => { if (!o || typeof o !== "object") return o; const r = {}; Object.entries(o).forEach(([k, v]) => { r[f(k)] = v }); return r };
const encLine = e => (!e || typeof e !== "object" || !("vs" in e || "sg" in e)) ? e : { ...e, ...(e.vs ? { vs: mapKeys(e.vs, k => k === "" ? BL : k) } : {}), ...(e.sg ? { sg: mapKeys(e.sg, k => k === "" ? BL : k) } : {}) };
const decLine = e => (!e || typeof e !== "object") ? e : { ...e, ...(e.vs ? { vs: mapKeys(e.vs, k => k === BL ? "" : k) } : {}), ...(e.sg ? { sg: mapKeys(e.sg, k => k === BL ? "" : k) } : {}) };
const decDoc = x => { if (!x || !x.lines) return x; const l = {}; Object.entries(x.lines).forEach(([k, v]) => { l[k] = decLine(v) }); return { ...x, lines: l } };
const encLines = o => { const r = {}; Object.entries(o).forEach(([k, v]) => { r[k] = encLine(v) }); return r };
/* 同步丟出的錯誤（例如資料格式不對）也要接住，不能讓按鈕卡住 */
const safe = fn => { try { const p = fn(); return p && p.catch ? p.catch(err) : p } catch (e) { err(e); return Promise.resolve() } };

  store = {

    setRv: async (d, s, id, o, v) => safe(() => edit(d, s, x => { const l = x.lines[id]; if (!l) return; l.rv ||= {}; if (v == null) delete l.rv[o || "_"]; else l.rv[o || "_"] = v })),

    setLastPrice: async (s, key, v) => { const a = rd(K.pr) || {}; (a[s] ||= {})[key] = { ...((a[s] || {})[key] || {}), ...v }; wr(K.pr, a); (L.pr || []).forEach(([q, f]) => q === s && f(a[s])) },

    setSent: async (d, s, v) => safe(() => edit(d, s, x => { x.sent = v })),
    setCk: async (d, s, key, v) => safe(() => edit(d, s, x => { x.ck ||= {}; if (v == null) delete x.ck[key]; else x.ck[key] = v })),
    prevOrder: async (d, s) => Object.values(orders()).filter(x => x.sup === s && x.date < d && Object.keys(x.lines || {}).length).sort((a, b) => b.date.localeCompare(a.date))[0] || null,

function seedDemo(K) {

function byVendor(cat, L) {

    byVendor(cat, L).forEach(({ vend, rows }) => { parts.push("", vend ? `【${cat}｜${vend}】` : `【${cat}】`); rows.forEach(r => parts.push(`${r.n}　${r.t}`)) });

      const per = new Map();
      qtyOpts(it, e).forEach(k => { const { spec, vend } = splitKey(it, k); const w = vend || "未分廠商"; per.set(w, [...(per.get(w) || []), partText(it, spec, e.vs[k])]) });

/* ================= 付款 =================
   應付：每張叫貨單「單價 × 實收（沒核對就用叫的數量）」，依付款對象分開
   付款對象：一般品項＝廠商（西螺）；分廠商的品項＝那一家（阿凱、大北園…）
   已付：付款紀錄；從最早的欠款開始沖（先進先出），可以分次付、抹零
   付款方式：每天現金（司機當場付）／週結（每週一次付）／匯款 */
const PAY_M = { daily: "每天現金", weekly: "週結", bank: "匯款" };
/* 帳款從這天開始算，之前的叫貨不列入（可在付款頁改） */
const DEF_PAY_START = "2026-10-01";
const payStart = () => (S.ocfg && S.ocfg.payStart) || DEF_PAY_START;
function payeeOf(sp, vend) { return vend ? (vend === "其他" ? `${sp.name}其他廠商` : vend) : sp.name }
function payeeCfg(n) { return ((S.ocfg && S.ocfg.payees) || {})[n] || {} }
function payeeMode(n) { return payeeCfg(n).m || "daily" }
/* 一張叫貨單 → { 付款對象: { a 金額, miss 沒單價筆數 } } */
function orderDues(o) {
  const sp = sups().find(q => q.id === o.sup), out = {};
  if (!sp || !o.lines) return out;
  Object.entries(o.lines).forEach(([id, e]) => {
    const it = sp.items.find(i => i.id === id); if (!it || !hasQty(e)) return;
    qtyOpts(it, e).forEach(k => {
      const w = vendorsOf(it).length ? splitKey(it, k).vend : "", pe = payeeOf(sp, w), p = priceOf(e, k);
      const d = (out[pe] ||= { a: 0, miss: 0 });
      if (p == null) d.miss++; else d.a += p * gotQty(e, k);
    });
  });
  Object.values(out).forEach(d => { d.a = Math.round(d.a) });
  return out;
}
function loadPayData() {
  S.payLoading = true;
  store.listRange(payStart(), "2999-12-31").then(os => { S.payOrders = os; S.payLoading = false; if (S.view === "Pay" || S.view === "Sum") render() }).catch(e => { S.payLoading = false; err(e) });
}
store.watchPays(x => { S.pays = x || []; if (S.view === "Pay" || S.view === "Sum") render() });
/* 帳本：每個付款對象的每一天應付、已沖銷、未付 */
function ledger() {
  const st = payStart();
  const os = (S.payOrders || []).filter(o => o.date >= st && !(o.date === S.date && o.sup === S.sup));
  if (S.ord && S.date >= st) os.push({ ...S.ord, date: S.date, sup: S.sup });
  const L = {};
  os.forEach(o => Object.entries(orderDues(o)).forEach(([pe, d]) => { const x = (L[pe] ||= { days: [], paid: 0, pays: [] }); x.days.push({ date: o.date, a: d.a, miss: d.miss }) }));
  (S.pays || []).filter(p => p.date >= st || (p.for && p.for >= st)).forEach(p => { const x = (L[p.pe] ||= { days: [], paid: 0, pays: [] }); x.paid += (+p.amt || 0) + (+p.adj || 0); x.pays.push(p) });
  Object.entries(L).forEach(([pe, x]) => {
    x.days.sort((a, b) => a.date.localeCompare(b.date));
    x.days.forEach(d => { d.paid = 0 });
    /* 指定日期的付款（例如司機當天付現）先沖那一天，剩下的再從最早的欠款開始沖 */
    let pool = 0;
    x.pays.forEach(p => {
      let v = (+p.amt || 0) + (+p.adj || 0);
      const d = p.for && x.days.find(q => q.date === p.for);
      if (d) { const c = Math.min(d.a - d.paid, v); d.paid += c; v -= c }
      pool += v;
    });
    x.days.forEach(d => { const c = Math.min(d.a - d.paid, Math.max(0, pool)); d.paid += c; d.left = d.a - d.paid; pool -= c });
    x.due = x.days.reduce((n, d) => n + d.a, 0);
    x.left = x.days.reduce((n, d) => n + d.left, 0);
    x.credit = Math.max(0, pool);   /* 多付 */
    x.miss = x.days.reduce((n, d) => n + d.miss, 0);
    x.pe = pe; x.m = payeeMode(pe);
  });
  return L;
}

      ${d ? its.map(it => `<div class="ed-row" data-rid="${it.id}"><input class="n" value="${esc(it.n)}" data-f="n"><input class="u" value="${esc((it.o || []).join("/"))}" data-f="o" placeholder="—"><input class="u" value="${esc(it.u || "")}" data-f="u" placeholder="—"><div class="ac">${((sup().vend || {})[it.c] || []).length ? `<button class="nvb${it.nv ? "" : " on"}" data-nv="1" title="分廠商叫貨">${it.nv ? "不分" : "分廠商"}</button>` : ""}<select class="cs" data-f="c" aria-label="分類">${cats.concat(cats.includes(it.c) ? [] : [it.c]).map(c => `<option${c === it.c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select><button class="lk${(it.inv || []).length ? "" : " no"}" data-lk="${it.id}">🔗 ${esc(linkTxt(it))}</button><button data-mv="-1" aria-label="上移">↑</button><button data-mv="1" aria-label="下移">↓</button><button class="del" data-del="1" aria-label="刪除">✕</button></div></div>`).join("")
        : `<div class="muted" style="line-height:1.8">${its.map(it => `${esc(it.n)}${it.nv && ((sup().vend || {})[it.c] || []).length ? `<small>(不分)</small>` : ""}${(it.inv || []).length ? "" : `<span style="color:var(--low)">*</span>`}`).join("、") || "—"}</div>`}`).join("")}
    ${d ? `<div class="grid2" style="margin-top:16px;position:sticky;bottom:calc(70px + var(--safe-b))"><button class="btn" id="edCancel">取消</button><button class="btn okb" id="edSave">儲存</button></div>` : ""}
  </div>
  <div class="panel"><h3>說明</h3><p class="muted" style="margin:0;line-height:1.7">
    ・叫貨資料：${store.mode === "fb" ? "存在叫貨自己的 Firebase，各手機即時同步" : `<b style="color:var(--low)">本機模式，只存在這支手機</b>（填入 ORDER_CONFIG 後會同步）`}<br>
    ・點貨資料：${inv.mode === "fb" ? "讀自「採鮮點貨」，只讀不改" : "示範資料"}<br>
    ・預估：每天用量 = 前一天庫存 + 前一天到貨 − 當天庫存；用前 4 個同星期幾的平均預估，再加安全量、扣掉庫存<br>
    ・用量資料不夠（剛開始用的前兩週）時，先用「安全量 − 庫存」<br>
    ・點貨和叫貨單位不同時，到品項的 🔗 連動裡設定換算（例如 1件＝2箱）<br>
    ・叫貨日沒有點貨時，會用最近一次的點貨紀錄，上方會標「不是當天」<br>
    ・按「複製 LINE 文字」會自動記錄已傳送；之後有改數量會提醒重傳</p></div>`;
}
function draftItem(id) { return S.draft.items.find(i => i.id === id) }
$("#vSet").addEventListener("click", async e => {
  const t = e.target;
  const sb = t.closest("[data-sup]");
  if (sb && !S.draft) { S.sup = sb.dataset.sup; try { localStorage.setItem("cxo-sup", S.sup) } catch {} renderSupSel(); openOrder(); render(); return }
  if (t.closest("[data-addsup]")) {
    if (S.draft) return toast("先儲存或取消品項編輯");
    const name = (prompt("新廠商名稱") || "").trim(); if (!name) return;
    const cfg = JSON.parse(JSON.stringify(S.ocfg)); const id = "s" + Date.now().toString(36);
    cfg.sups.push({ id, name, items: [] }); await store.saveOrdCfg(cfg).catch(err);
    S.sup = id; renderSupSel(); openOrder(); S.draft = JSON.parse(JSON.stringify(sup() || { id, name, items: [] })); renderSet(); toast("已新增，接著加品項"); return;
  }
  if (t.closest("#supRen")) { const name = (prompt("廠商名稱", sup().name) || "").trim(); if (!name) return; const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.sups.find(x => x.id === S.sup).name = name; if (S.draft) S.draft.name = name; await store.saveOrdCfg(cfg).catch(err); return }
  if (t.closest("#supDel")) { if (!confirm(`刪除「${sup().name}」和它的叫貨品項？（過去的叫貨紀錄會保留）`)) return; const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.sups = cfg.sups.filter(x => x.id !== S.sup); S.draft = null; S.sup = cfg.sups[0].id; await store.saveOrdCfg(cfg).catch(err); renderSupSel(); openOrder(); return }
  if (t.closest("#addClosed")) { const v = $("#closedIn").value; if (!v) return toast("先選日期"); if (closedList().includes(v)) return; const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.closed = [...closedList(), v].sort(); await store.saveOrdCfg(cfg).catch(err); return }
  const dc = t.closest("[data-delc]"); if (dc) { const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.closed = closedList().filter(x => x !== dc.dataset.delc); await store.saveOrdCfg(cfg).catch(err); return }
  const pbox = t.closest("[data-pcid]");
  if (pbox) {
    const id = pbox.dataset.pcid;
    if (t.closest("[data-pcadd]")) return savePc(x => { const it = x.items.find(i => i.id === id); it.pc.outs = [...(it.pc.outs || []), { n: "", y: 0, u: "KG", uw: 0, add: 0 }] });
    const rm = t.closest("[data-pcrm]"); if (rm) { const k = +rm.closest("[data-k]").dataset.k; return savePc(x => { const it = x.items.find(i => i.id === id); it.pc.outs.splice(k, 1) }) }
    if (t.closest("[data-pcdel]")) { if (!confirm("移除這個品項的加工成本設定？")) return; return savePc(x => { const it = x.items.find(i => i.id === id); delete it.pc }) }
  }
  if (t.closest("#pcAddItem")) { const id = $("#pcNew").value; if (!id) return toast("先選一個品項"); return savePc(x => { const it = x.items.find(i => i.id === id); it.pc = { w: 0, outs: [{ n: "", y: 0, u: "KG", uw: 0, add: 0 }] } }, "已加入，填原料重量和成品") }
  if (t.closest("[data-addp]")) { const n = (prompt("人員名字") || "").trim(); if (!n || people().includes(n)) return; const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.people = [...people(), n]; await store.saveOrdCfg(cfg).catch(err); return }
  const dp = t.closest("[data-delp]"); if (dp) { const n = dp.dataset.delp; if (!confirm(`移除 ${n}？`)) return; const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.people = people().filter(x => x !== n); await store.saveOrdCfg(cfg).catch(err); if (S.me === n) { S.me = ""; try { localStorage.removeItem("caixian-order-me") } catch {} renderWho() } return }
  if (t.closest("#edStart")) { S.draft = JSON.parse(JSON.stringify(sup())); renderSet(); return }
  if (t.closest("#edCancel")) { S.draft = null; renderSet(); return }
  if (t.closest("#edSave")) {
    syncDraftInputs();
    const bad = S.draft.items.filter(i => !i.n.trim()); if (bad.length) return toast("有品項沒填品名");
    const cfg = JSON.parse(JSON.stringify(S.ocfg)); const k = cfg.sups.findIndex(x => x.id === S.draft.id); cfg.sups[k] = S.draft;
    S.draft = null; await store.saveOrdCfg(cfg).then(() => toast("已儲存")).catch(err); renderSet(); return;
  }
  if (!S.draft) return;
  const add = t.closest("[data-add]");
  if (add) { syncDraftInputs(); const c = add.dataset.add; const id = "o" + Date.now().toString(36); const its = S.draft.items; const last = its.map(i => i.c).lastIndexOf(c); its.splice(last + 1, 0, { id, c, n: "", o: [], u: "", inv: [] }); renderSet(); document.querySelector(`[data-rid="${id}"] .n`)?.focus(); return }
  const row = t.closest("[data-rid]"); if (!row) return;
  syncDraftInputs();
  const id = row.dataset.rid, its = S.draft.items, i = its.findIndex(x => x.id === id);
  if (t.closest("[data-del]")) { its.splice(i, 1); renderSet(); return }
  if (t.closest("[data-nv]")) { if (its[i].nv) delete its[i].nv; else its[i].nv = 1; renderSet(); return }
  const mv = t.closest("[data-mv]");
  if (mv) { const dir = +mv.dataset.mv; let j = i + dir; while (its[j] && its[j].c !== its[i].c) j += dir; if (!its[j]) return; [its[i], its[j]] = [its[j], its[i]]; renderSet(); return }
  if (t.closest("[data-lk]")) { S.lkItem = id; openLink(); return }
});
/* 加工成本設定：改了就直接存（不用按儲存） */
async function savePc(fn, msg) {
  if (S.draft) return toast("先儲存或取消上面的品項編輯");
  const cfg = JSON.parse(JSON.stringify(S.ocfg)), x = cfg.sups.find(q => q.id === S.sup);
  fn(x); await store.saveOrdCfg(cfg).then(() => msg && toast(msg)).catch(err);
}
$("#vSet").addEventListener("change", async e => {
  const box = e.target.closest("[data-pcid]");
  if (box && e.target.matches("input")) {
    const id = box.dataset.pcid, row = e.target.closest("[data-k]");
    return savePc(x => {
      const it = x.items.find(i => i.id === id); if (!it || !it.pc) return;
      delete it.pc.ex;   /* 改過就不是範例了 */
      if (e.target.hasAttribute("data-pcw")) { it.pc.w = Math.max(0, +e.target.value || 0); return }
      if (!row) return;
      const o = it.pc.outs[+row.dataset.k]; if (!o) return;
      const f = e.target.dataset.f, v = e.target.value.trim();
      if (f === "n" || f === "u") o[f] = v; else o[f] = v === "" ? 0 : Math.max(0, +v || 0);
      if (f === "u" && /^(kg|公斤)$/i.test(v || "KG")) o.uw = 0;
    });
  }
  const cs = e.target.closest('select[data-f="c"]');
  if (cs && S.draft) {
    syncDraftInputs();
    const id = cs.closest("[data-rid]").dataset.rid, its = S.draft.items, k = its.findIndex(i => i.id === id);
    const [it] = its.splice(k, 1); it.c = cs.value;
    const last = its.map(i => i.c).lastIndexOf(it.c); its.splice(last >= 0 ? last + 1 : its.length, 0, it);
    renderSet(); toast(`${it.n || "品項"} 移到 ${it.c}`); return;
  }
  const vd = e.target.closest("[data-vend]");
  if (vd) {
    const list = [...new Set(vd.value.split(/[、,，\/\s]+/).map(x => x.trim()).filter(Boolean))];
    const cfg = JSON.parse(JSON.stringify(S.ocfg)), x = cfg.sups.find(q => q.id === S.sup);
    x.vend = { ...(x.vend || {}) }; if (list.length) x.vend[vd.dataset.vend] = list; else delete x.vend[vd.dataset.vend];
    await store.saveOrdCfg(cfg).then(() => toast(list.length ? `${vd.dataset.vend}：${list.join("、")}` : `${vd.dataset.vend} 不分廠商`)).catch(err); return;
  }
  const k = e.target.closest("[data-keep]"); if (!k) return;
  const v = Math.max(1, Math.min(10, Math.round(+k.value || 1)));
  const cfg = JSON.parse(JSON.stringify(S.ocfg)); cfg.keep = { ...(cfg.keep || {}), [k.dataset.keep]: v };
  await store.saveOrdCfg(cfg).then(() => toast(`${k.dataset.keep} 最多放 ${v} 天`)).catch(err);
});
function syncDraftInputs() {
  if (!S.draft) return;
  document.querySelectorAll("#vSet [data-rid]").forEach(r => {
    const it = draftItem(r.dataset.rid); if (!it) return;
    it.n = r.querySelector('[data-f="n"]').value.trim();
    it.o = r.querySelector('[data-f="o"]').value.split(/[\/、,，|]/).map(x => x.trim()).filter(Boolean);
    it.u = r.querySelector('[data-f="u"]').value.trim();
  });
}
function openLink() {
  const it = draftItem(S.lkItem); if (!it) return;
  $("#lkTitle").textContent = `連動點貨：${it.n || "新品項"}`;
  $("#lkQ").value = ""; renderLink(); openSheet("lk");
}
function renderLink() {
  const it = draftItem(S.lkItem); if (!it) return;
  const q = norm($("#lkQ").value), sel = new Set(it.inv || []);
  const cats = (S.inv && S.inv.cats) || DEF_CATS;
  const guess = norm(it.n);
  const list = invItems().filter(i => !q || norm(i.n).includes(q));
  const html = cats.map(c => { const l = list.filter(i => i.c === c).sort((a, b) => (sel.has(b.id) - sel.has(a.id)) || ((norm(b.n).includes(guess) && guess) - (norm(a.n).includes(guess) && guess))); return l.length ? `<div class="gh" style="color:${catColor(c)}">${esc(c)}</div>` + l.map(i => `<label><input type="checkbox" data-inv="${i.id}"${sel.has(i.id) ? " checked" : ""}><span>${esc(i.n)}<small style="display:block">${esc(i.u || "")}${iMin(i) ? `　安全${fmt(iMin(i))}` : ""}</small></span>${sel.has(i.id) ? `<span class="fx">1${esc(it.u || (it.o && it.o.find(isUnitOpt)) || "單位")}＝<input type="number" step="0.1" min="0.01" inputmode="decimal" data-fx="${i.id}" value="${fmt(factorOf(it, i.id))}">${esc(iUnits(i)[0])}</span>` : ""}</label>`).join("") : "" }).join("");
  $("#lkList").innerHTML = html || `<div class="empty">找不到點貨品項</div>`;
}
$("#lkQ").oninput = renderLink;
$("#lkList").onchange = e => {
  const it = draftItem(S.lkItem); if (!it) return;
  const fx = e.target.closest("[data-fx]");
  if (fx) { const v = +fx.value; it.fx = { ...(it.fx || {}) }; if (v > 0 && v !== 1) it.fx[fx.dataset.fx] = v; else delete it.fx[fx.dataset.fx]; return }
  const cb = e.target.closest("[data-inv]"); if (!cb) return;
  const set = new Set(it.inv || []); cb.checked ? set.add(cb.dataset.inv) : set.delete(cb.dataset.inv); it.inv = [...set]; it.manual = 1;
  const y = $("#lkList").scrollTop; renderLink(); $("#lkList").scrollTop = y;
};
$("#lkList").addEventListener("click", e => { if (e.target.closest(".fx")) e.preventDefault() });
$("#lkOk").onclick = closeSheets;
</script>
